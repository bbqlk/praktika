<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float property and parent without text</title>
    <link rel="stylesheet" href="fstyle4.css">
</head>
<body>
    <div class="parent">
	<div class="child"><p class="text">Text1</p></div>
	<div class="child"><p class="text">Text2</p></div>
    <div class="child"><p class="text">Text3</p></div>
    <div class="child"><p class="text">Text4</p></div>
    <div class="child"><p class="text">Text5</p></div>
	<div class="clearfix"></div>
</div>
<div class="parent">
	<div class="child2"><p class="text">Text1</p></div>
	<div class="child2"><p class="text">Text2</p></div>
    <div class="child2"><p class="text">Text3</p></div>
    <div class="child2"><p class="text">Text4</p></div>
    <div class="child2"><p class="text">Text5</p></div>
	<div class="clearfix"></div>
</div>
</body>
</html>
