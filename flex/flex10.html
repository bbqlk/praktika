<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aligning a single element in the flex model</title>
    <link rel="stylesheet" href="flstyle10.css">
</head>
<body>
    <div class="parent">
        <div class="child"><p class="text">1</p></div>
        <div class="child"><p class="text">2</p></div>
        <div class="child elem1"><p class="text">3</p></div>
        <div class="child"><p class="text">4</p></div>
        <div class="child"><p class="text">5</p></div>
    </div>
    <div class="parent2">
        <div class="child2"><p class="text">1</p></div>
        <div class="child2"><p class="text">2</p></div>
        <div class="child2 elem2"><p class="text">3</p></div>
        <div class="child2"><p class="text">4</p></div>
        <div class="child2"><p class="text">5</p></div>
        </div>
    <div class="parent3">
        <div class="child"><p class="text">1</p></div>
        <div class="child"><p class="text">2</p></div>
        <div class="child elem3"><p class="text">3</p></div>
        <div class="child"><p class="text">4</p></div>
        <div class="child"><p class="text">5</p></div>
        </div>
</body>
</html>
